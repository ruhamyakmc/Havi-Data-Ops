name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: havi
          POSTGRES_USER: havi_user
          POSTGRES_PASSWORD: havi_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U havi_user -d havi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      HAVI_TEST_DATABASE_URL: postgresql+psycopg2://havi_user:havi_password@localhost:5432/havi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest
